spring.application.name=checkup-web

# --- Database (development) ---
# H2 runs inside the app. "mem" means data lives in memory and resets on restart;
# Flyway rebuilds the tables and demo data every time the app starts.
spring.datasource.url=jdbc:h2:mem:checkup;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE
spring.datasource.username=sa
spring.datasource.password=

# Flyway owns the schema (src/main/resources/db/migration/V*.sql).
# Hibernate only *checks* that the Java entities match those tables; it never changes them.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Browse the dev database at http://localhost:8080/h2-console
# (JDBC URL: jdbc:h2:mem:checkup, user: sa, no password)
spring.h2.console.enabled=true
