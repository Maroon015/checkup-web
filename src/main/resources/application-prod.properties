# Production settings. Turned on with SPRING_PROFILES_ACTIVE=prod (Dockerfile does this).
# Anything here overrides application.properties.
#
# No secrets live in this file: the database address and password come from
# environment variables set on the server (or in docker-compose.yml for local runs).

# --- Database: PostgreSQL ---
# Either give the full JDBC URL in DB_URL (docker-compose, CI), or give the pieces
# DB_HOST / DB_PORT / DB_NAME (Render's render.yaml passes them this way), and the URL is
# built from them. ${A:B} means "A if it's set, otherwise B".
spring.datasource.url=${DB_URL:jdbc:postgresql://${DB_HOST}:${DB_PORT:5432}/${DB_NAME}}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# --- Never expose the database browser on a public server ---
spring.h2.console.enabled=false

# --- Running behind a hosting provider's HTTPS proxy ---
# Hosts like Render set PORT; fall back to 8080 locally.
server.port=${PORT:8080}
# Trust the proxy's X-Forwarded-* headers so redirects and secure cookies use https.
server.forward-headers-strategy=framework
# Session cookie: only sent over HTTPS, not readable by JavaScript.
server.servlet.session.cookie.secure=true
server.servlet.session.cookie.http-only=true

# --- Demo data ---
# On by default so the portfolio demo has accounts to click into. It only runs when the
# database is empty. Set DEMO_DATA=false for a real deployment.
checkup.demo-data.enabled=${DEMO_DATA:true}

# Less noise in production logs.
spring.jpa.show-sql=false
logging.level.org.flywaydb=info
