<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('My dashboard')}"></head>
<body>
<header th:replace="~{fragments :: nav}"></header>
<main>
    <div th:replace="~{fragments :: flash}"></div>
    <h1>Hi, <span th:text="${patient.firstName}">Alex</span></h1>
    <p><a class="button" th:href="@{/patient/book}">Book an appointment</a></p>

    <h2>My appointments</h2>
    <p th:if="${#lists.isEmpty(appointments)}" class="muted">You don't have any appointments yet.</p>
    <table th:unless="${#lists.isEmpty(appointments)}">
        <thead>
            <tr><th>When</th><th>Doctor</th><th>Clinic</th><th>Reason</th><th>Status</th><th></th></tr>
        </thead>
        <tbody>
            <tr th:each="a : ${appointments}">
                <td th:text="${#temporals.format(a.startTime, 'EEE d MMM yyyy, h:mm a')}">Mon 1 Jan 2030, 9:00 AM</td>
                <td th:text="${a.doctor.fullName}">Dr. Jordan Patel</td>
                <td th:text="${a.doctor.clinic.name + ', ' + a.doctor.clinic.city}">Northside, London</td>
                <td th:text="${a.reason}">Annual check-up</td>
                <td><span class="status" th:classappend="${#strings.toLowerCase(a.status)}" th:text="${a.status}">CONFIRMED</span></td>
                <td>
                    <!-- The button only shows when the 24-hour rule allows it; the server
                         checks the rule again anyway, because a hidden button isn't security. -->
                    <form th:if="${a.canBeCancelledByPatient(now)}"
                          th:action="@{/patient/appointments/{id}/cancel(id=${a.id})}" method="post"
                          onsubmit="return confirm('Cancel this appointment?');">
                        <button type="submit" class="secondary small">Cancel</button>
                    </form>
                    <span th:if="${a.active and !a.canBeCancelledByPatient(now)}" class="muted small">
                        Within 24h: call the clinic to cancel
                    </span>
                </td>
            </tr>
        </tbody>
    </table>
</main>
</body>
</html>
