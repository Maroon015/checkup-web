<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Log in')}"></head>
<body>
<header th:replace="~{fragments :: nav}"></header>
<main class="narrow">
    <h1>Log in</h1>

    <p class="notice" th:if="${registered}">Account created. You can log in now.</p>
    <!-- Spring Security sends you back here with ?error when the login fails. The message
         is the same for a wrong email and a wrong password, on purpose. -->
    <p class="error" th:if="${param.error}">Wrong email or password.</p>

    <!-- Posts to /login, which Spring Security handles. th:action adds the CSRF token. -->
    <form th:action="@{/login}" method="post" class="stack">
        <label>Email <input type="email" name="email" autocomplete="username" required autofocus></label>
        <label>Password <input type="password" name="password" autocomplete="current-password" required></label>
        <button type="submit">Log in</button>
    </form>
    <p>New patient? <a th:href="@{/register}">Create an account</a></p>

    <section class="demo" th:if="${demoLoginEnabled}">
        <h2>Just looking around?</h2>
        <p class="muted">These are made-up demo accounts with fake data.</p>
        <!-- Each button is a tiny login form with the demo email and password filled in. -->
        <form th:action="@{/login}" method="post" class="inline">
            <input type="hidden" name="email" th:value="${demoPatientEmail}">
            <input type="hidden" name="password" th:value="${demoPassword}">
            <button type="submit" class="secondary">Log in as demo patient</button>
        </form>
        <form th:action="@{/login}" method="post" class="inline">
            <input type="hidden" name="email" th:value="${demoDoctorEmail}">
            <input type="hidden" name="password" th:value="${demoPassword}">
            <button type="submit" class="secondary">Log in as demo doctor</button>
        </form>
    </section>
</main>
</body>
</html>
