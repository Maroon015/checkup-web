# Continuous integration: GitHub runs this on every push and pull request.
# A green check on GitHub means all three jobs below passed.
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read   # this workflow only needs to read the code

jobs:
  # 1. The full test suite (unit, database, web and the booking race test) on H2.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
      - name: Run tests
        run: ./mvnw -B verify

  # 2. Start the real app against a real PostgreSQL, the way production runs it.
  #    Proves the Flyway migrations run on PostgreSQL, Hibernate's schema check passes,
  #    the demo data loads, and the main pages answer.
  postgres-smoke:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: checkup
          POSTGRES_USER: checkup
          POSTGRES_PASSWORD: ci-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U checkup -d checkup"
          --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
      - name: Build the jar
        run: ./mvnw -B -q -DskipTests package
      - name: Start the app with the prod profile
        env:
          SPRING_PROFILES_ACTIVE: prod
          DB_URL: jdbc:postgresql://localhost:5432/checkup
          DB_USERNAME: checkup
          DB_PASSWORD: ci-only
        run: |
          java -jar target/checkup-web-0.0.1-SNAPSHOT.jar > app.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -sf http://localhost:8080/login > /dev/null; then echo "App is up"; exit 0; fi
            sleep 2
          done
          echo "App did not start"; cat app.log; exit 1
      - name: Check pages and startup log
        run: |
          curl -sf http://localhost:8080/ | grep -q "Welcome to"
          curl -sf http://localhost:8080/login | grep -q "Log in as demo patient"
          curl -sf http://localhost:8080/careers | grep -q "Work with us"
          # Private pages must redirect to the login page, not open.
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/patient)" = "302"
          # The database browser must be OFF in production.
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/h2-console)" != "200"
          grep -q "Successfully applied 4 migrations" app.log
          grep -q "Loaded demo data" app.log
      - name: Show the app log if anything failed
        if: failure()
        run: cat app.log

  # 3. Make sure the Docker image still builds.
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the image
        run: docker build -t checkup-web:ci .
